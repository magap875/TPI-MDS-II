<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Panel Vendedor</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg border-bottom">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img
                        style="width: 7.5rem; margin: 0.5rem 0 0.5rem 7rem;"
                        src="/img/logo.png"
                        alt="logo-body-painting">
                </a>
                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup">

                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="../index.html">
                            <i class="fa-solid fa-user"></i>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <div class="container mt-5">
            <div class="panel-admin shadow-lg p-4">
                <h2 class="text-center mb-4 fw-bold">
                    Panel Vendedor
                </h2>
                <h4 class="mb-4">
                    Pedidos pendientes de entrega
                </h4>
                <div id="contenedor-pedidos" class="d-flex flex-column gap-3">
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top">
        <img src="/img/logo.png" alt="logo-body-painting">
        <p>&copy; 2025 Body Painting. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/panel-vendedor.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
