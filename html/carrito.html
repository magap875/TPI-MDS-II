<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
/>
    <link rel="stylesheet" href="../css/estilos.css">

</head>

<body>

    <header class="border-bottom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">

            <a href="../index.html">
                <img src="../img/logo.png" alt="Body Painting" style="width: 6rem;">
            </a>

            <div class="d-flex gap-2">

                <button class="btn btn-outline-dark btn-sm" id="btnHistorialPedidos">
                    Ver historial de pedidos
                </button>

                <a href="../index.html" class="btn btn-outline-dark btn-sm">
                    Seguir comprando
                </a>

            </div>

        </div>
    </header>



    <main class="container">

        <h1 class="mb-4">Mi carrito</h1>

        <div class="row g-4">
            <!-- contenedor de items de carrito -->
            <div class="col-12 col-lg-8">
                <div id="contenedor-carrito"></div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="mb-3">Resumen</h4>
                        <p class="d-flex justify-content-between">
                            <span>Total</span>
                            <strong id="total-carrito">$0</strong>
                        </p>

                        <button id="btn-confirmar-pedido" class="btn btn-dark w-100">
                            Comprar
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/historialPedidos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
