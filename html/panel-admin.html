<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Panel de Admin</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg border-bottom">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html"><img style="width: 7.5rem; margin: 0.5rem 0 0.5rem 7rem;"
                        src="/img/logo.png" alt="logo-body-painting"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="../index.html"><i class="fa-solid fa-user"></i></a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container mt-5">
            <!-- PANEL PRINCIPAL -->
            <div class="panel-admin shadow-lg p-4">
                <h2 class="text-center mb-4 fw-bold">Panel Administrador</h2>
                <div class="row g-4">
                    <!-- FORMULARIO -->
                    <div class="col-md-6">
                        <div class="registro p-4 h-100">
                            <h2 class="text-center mb-4 form-registro-title">Alta de productos</h2>
                            <form action="#" name="registroProducto" method="post" id="formProducto">
                                <input type="hidden" id="producto-id">

                                <div class="mb-3 form-floating">
                                    <input type="text" name="nombre" class="form-control" id="nombre" required><label
                                        for="nombre">Nombre</label>
                                </div>

                                <div class="mb-3 form-floating">
                                    <input type="number" name="precio" min="1" class="form-control" id="precio"
                                        required><label for="precio">Precio</label>
                                </div>

                                <div class="mb-3 form-floating">
                                    <input type="text" name="marca" class="form-control" id="marca" required><label
                                        for="marca">Marca</label>
                                </div>
                                <div class="mb-3 form-floating">
                                    <input type="number" name="stock" min="1" class="form-control" id="stock"
                                        required><label for="stock">Stock</label>
                                </div>

                                <div class="mb-3 form-floating">
                                    <input type="number" name="stockMinimo" min="1" step="1" class="form-control"
                                        id="stockMinimo" required>
                                    <label for="stockMinimo">Stock mínimo</label>
                                </div>

                                <div class="mb-3 form-floating">
                                    <input type="file" name="imagen" class="form-control" accept=".jpg,.jpeg,.png"
                                        id="imagen" required><label for="imagen">Tipo PNG o JPG</label>
                                </div>

                                <button type="submit" name="btnRegistrar" class="btn btn-violeta w-100">
                                    Agregar producto
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- PREVIEW -->
                    <div class="col-md-6">
                        <div class="preview p-4 h-100">
                            <h5 class="mb-4 text-center">Vista previa</h5>

                            <div class="preview-card">
                                <div class="img-preview"></div>

                                <div class="preview-body text-center mt-3">
                                    <p class="fw-bold mb-1" id="preview-nombre">Nombre producto</p>
                                    <p class="text-muted mb-1" id="preview-precio">Precio</p>
                                    <p class="text-muted mb-1" id="preview-marca">Marca</p>
                                    <p class="text-muted mb-1" id="preview-stock">Stock</p>
                                    <p class="text-muted mb-1" id="preview-stock-minimo">Stock mínimo</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="container mt-4">
                    <h3 class="mb-3">Productos cargados</h3>

                    <div class="filtros-container mb-4">
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <div class="filtro-group">
                                    <label class="filtro-label">Buscar producto por nombre</label>
                                    <input id="filtro-texto" class="form-control" placeholder="Ej: Pintura..." />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="filtro-group">
                                    <label class="filtro-label">Buscar producto por marca</label>
                                    <input id="filtro-marca" class="form-control" placeholder="Ej: SkinPro..." />
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">
                            <div class="col-md-8">
                                <div class="rango-box">
                                    <div class="rango-titulo">
                                        <i class="fa-solid fa-dollar-sign"></i>
                                        Filtrar por rango de precio
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-md-6">
                                            <input id="filtro-precio-min" min="1" type="number" class="form-control"
                                                placeholder="Precio mínimo" />
                                        </div>
                                        <div class="col-md-6">
                                            <input id="filtro-precio-max" min="1" type="number" class="form-control"
                                                placeholder="Precio máximo" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="filtro-group">
                                    <label class="filtro-label">Ordenar por...</label>
                                    <select id="ordenar" class="form-select">
                                        <option value="none">Ver todos</option>
                                        <option value="precio-asc">Más baratos</option>
                                        <option value="precio-desc">Más caros</option>
                                        <option value="stock-asc">Menor stock</option>
                                        <option value="stock-desc">Mayor stock</option>
                                        <option value="stock-bajo">Stock bajo</option>
                                        <option value="inactivos">Dados de baja</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="contenedor-productos" class="row g-4"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top">
        <img src="/img/logo.png" alt="logo-body-painting">
        <p>&copy; 2025 Body Painting. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/panel-admin.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal fade" id="modalEditarProducto" tabindex="-1">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="text-center mb-3">
                        <img id="editar-img" class="img-fluid rounded shadow w-100"
                            style="max-height: 180px; object-fit: cover;" />
                    </div>

                    <input type="hidden" id="editar-id">

                    <div class="form-floating mb-2">
                        <input type="text" id="editar-nombre" class="form-control">
                        <label>Nombre</label>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="number" id="editar-precio" class="form-control">
                        <label>Precio</label>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="text" id="editar-marca" class="form-control">
                        <label>Marca</label>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="number" id="editar-stock" class="form-control">
                        <label>Stock</label>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="number" id="editar-stockMinimo" class="form-control">
                        <label>Stock mínimo</label>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="file" id="editar-imagen" class="form-control">
                        <label>Imagen</label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-violeta" id="guardar-edicion">Guardar</button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
